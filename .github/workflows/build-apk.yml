name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies & Add Android Platform
        run: |
          cd akunmath-pro/akunmath-pro
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd akunmath-pro/akunmath-pro/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: akunmath-pro/akunmath-pro/android/app/build/outputs/apk/debug/app-debug.apk
